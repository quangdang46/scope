name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.crate }} for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        crate: [scope-cli, scope-mcp]
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            method: cross
            suffix: linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            method: cross
            suffix: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-13
            method: native
            suffix: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-14
            method: native
            suffix: macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            method: native
            suffix: windows-x86_64
          - crate: scope-cli
            bin: scope
          - crate: scope-mcp
            bin: scope-mcp

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.method == 'cross'
        uses: taiki-e/install-action@cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.method }}" = "cross" ]; then
            cross build --release --target ${{ matrix.target }} --package ${{ matrix.crate }}
          else
            cargo build --release --target ${{ matrix.target }} --package ${{ matrix.crate }}
          fi

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release

          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ (v[0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="$TAG"
          fi

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BIN_NAME="${{ matrix.bin }}.exe"
            ARCHIVE="${{ matrix.bin }}-${VERSION}-${{ matrix.suffix }}.zip"
            7z a "../../${ARCHIVE}" "${BIN_NAME}"
            cd ../../
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            BIN_NAME="${{ matrix.bin }}"
            ARCHIVE="${{ matrix.bin }}-${VERSION}-${{ matrix.suffix }}.tar.gz"
            tar -czf "../../${ARCHIVE}" "${BIN_NAME}"
            cd ../../
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
            else
              shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
            fi
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.crate }}-${{ matrix.target }}
          path: |
            target/${{ matrix.bin }}-*.zip
            target/${{ matrix.bin }}-*.zip.sha256
            target/${{ matrix.bin }}-*.tar.gz
            target/${{ matrix.bin }}-*.tar.gz.sha256

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: output
          pattern: target-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*
          generate_release_notes: true
