[workspace]
members = [
  "crates/scope-core",
  "crates/scope-cli",
  "crates/scope-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Local static analysis engine and CLI for dependency and impact queries"

[workspace.dependencies]
clap = { version = "4.5.32", features = ["derive"] }
ignore = "0.4.23"
rusqlite = { version = "0.34.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
