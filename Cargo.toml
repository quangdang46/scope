[workspace]
members = [
  "crates/scope-core",
  "crates/scope-cli",
  "crates/scope-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Local static analysis engine and CLI for dependency and impact queries"

[workspace.dependencies]
clap = { version = "4.5.32", features = ["derive"] }
blake3 = "1"
glob = "0.3.2"
ignore = "0.4.23"
rusqlite = { version = "0.34.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
toml = "0.8.20"
chrono = "0.4.40"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
zstd = "0.13.3"
axum = "0.8.1"
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "net"] }
rustyline = { version = "13", features = ["derive"] }
open = "5.3.2"
tower = { version = "0.5.2", features = ["util"] }
